name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: linux-amd64
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Run project checks
        run: nix develop --command just check
