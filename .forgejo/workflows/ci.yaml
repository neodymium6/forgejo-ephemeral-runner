name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: forgejo-ephemeral-amd64
    timeout-minutes: 30
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
        build-users-group =
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify the runner runtime
        run: bash scripts/verify-runner-runtime.sh

      - name: Run project checks
        run: nix develop --command just check
