name: Release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yaml

  release:
    needs: e2e
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0

      - name: Run project checks
        run: nix develop --command just check

      - name: Prepare release tools
        run: |
          release_tools=$(nix build .#release-tools --no-link --print-out-paths)
          printf '%s/bin\n' "$release_tools" >>"$GITHUB_PATH"

      - name: Publish OCI images
        env:
          REGISTRY_HOST: ghcr.io
          REGISTRY_IMAGE_PREFIX: ${{ github.repository }}
          REGISTRY_IMAGE_SEPARATOR: "-"
          REGISTRY_GITHUB_PACKAGE_OWNER: ${{ github.repository_owner }}
          REGISTRY_REPOSITORY: ${{ github.repository }}
          REGISTRY_REPOSITORY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop --command scripts/publish-images.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/release/*
