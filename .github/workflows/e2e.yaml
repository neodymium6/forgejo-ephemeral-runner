name: E2E

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      E2E_CONTAINER_PROVIDER: docker
      E2E_KEEP_CLUSTER: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free space for Nix images and Kind
        run: |
          # These preinstalled SDKs are unused on this disposable GitHub VM.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h .

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0

      - name: Check E2E prerequisites
        id: preflight
        run: nix develop --command just e2e-preflight

      - name: Run the disposable Kind E2E harness
        timeout-minutes: 90
        run: nix develop --command just e2e

      - name: Clean up the disposable E2E environment
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        timeout-minutes: 5
        run: nix develop --command just e2e-clean
