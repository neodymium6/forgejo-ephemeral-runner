apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          # Loaded from the digest-verified E2E image cache before deployment.
          image: docker.io/library/forgejo-e2e:15.0.5
          imagePullPolicy: Never
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__database__PATH
              value: /data/forgejo/forgejo.db
            - name: FORGEJO__server__DOMAIN
              value: forgejo.forgejo-e2e.svc.cluster.local
            - name: FORGEJO__server__ROOT_URL
              value: http://forgejo.forgejo-e2e.svc.cluster.local:3000/
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__actions__ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
        - name: registration-gate
          image: forgejo-ephemeral-runner-e2e-proxy:e2e
          imagePullPolicy: Never
          env:
            - name: LISTEN_ADDR
              value: :3001
            - name: UPSTREAM_URL
              value: http://127.0.0.1:3000
          ports:
            - name: e2e-proxy
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /__e2e/health
              port: e2e-proxy
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
