apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo-ephemeral-runner
resources:
  - namespace.yaml
  - service-account.yaml
  - rbac.yaml
  - configmaps.yaml
  - controller-deployment.yaml
  - network-policy.yaml
configMapGenerator:
  - name: forgejo-runner-config
    files:
      - config.yaml=runner-config.yaml
  - name: forgejo-runner-pod-template
    files:
      - runner-pod.json=runner-pod.json
generatorOptions:
  disableNameSuffixHash: true
