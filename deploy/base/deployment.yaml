apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-ephemeral-runner
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-ephemeral-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-ephemeral-runner
    spec:
      automountServiceAccountToken: false
      serviceAccountName: forgejo-runner-reaper
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: register
          image: forgejo-ephemeral-runner:0.1.0-dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/forgejo-ephemeral-register"]
          envFrom:
            - configMapRef:
                name: forgejo-runner-settings
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOME
              value: /home/runner
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: runner-config
              mountPath: /etc/forgejo-runner
              readOnly: true
            - name: runner-state
              mountPath: /var/lib/forgejo-runner
            - name: registration-token
              mountPath: /run/secrets/forgejo-registration
              readOnly: true
            - name: home
              mountPath: /home/runner
            - name: tmp
              mountPath: /tmp
      containers:
        - name: runner
          image: forgejo-ephemeral-runner:0.1.0-dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/forgejo-ephemeral-one-job"]
          envFrom:
            - configMapRef:
                name: forgejo-runner-settings
          env:
            - name: HOME
              value: /home/runner
            - name: TMPDIR
              value: /tmp
            - name: NIX_CONFIG
              value: |
                experimental-features = nix-command flakes
                sandbox = false
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: 1500m
              memory: 1280Mi
              ephemeral-storage: 16Gi
          volumeMounts:
            - name: runner-config
              mountPath: /etc/forgejo-runner
              readOnly: true
            - name: runner-state
              mountPath: /var/lib/forgejo-runner
            - name: lifecycle
              mountPath: /var/run/forgejo-ephemeral-runner
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/runner
            - name: tmp
              mountPath: /tmp
        - name: reaper
          image: forgejo-ephemeral-runner-reaper:0.1.0-dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUNNER_CONTAINER_NAME
              value: runner
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: lifecycle
              mountPath: /var/run/forgejo-ephemeral-runner
              readOnly: true
            - name: reaper-token
              mountPath: /var/run/secrets/forgejo-reaper
              readOnly: true
      volumes:
        - name: runner-config
          configMap:
            name: forgejo-runner-config
        - name: runner-state
          emptyDir: {}
        - name: lifecycle
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 4Gi
        - name: home
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: registration-token
          secret:
            secretName: forgejo-runner-registration
        - name: reaper-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
